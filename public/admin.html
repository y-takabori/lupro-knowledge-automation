<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LUPRO Notion DB 管理</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f5ef;
      --surface: #ffffff;
      --text: #1f2933;
      --muted: #65758b;
      --line: #d9dee8;
      --accent: #1f7a68;
      --accent-dark: #175d50;
      --danger: #b42318;
      --success: #0f766e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    main {
      width: min(100%, 720px);
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      line-height: 1.3;
    }

    p {
      margin: 0 0 16px;
      color: var(--muted);
    }

    form {
      display: grid;
      gap: 14px;
      margin-top: 20px;
      padding: 18px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    label {
      display: grid;
      gap: 8px;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 48px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font: inherit;
    }

    button {
      min-height: 48px;
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: #ffffff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    button:not(:disabled):hover {
      background: var(--accent-dark);
    }

    .note,
    .result {
      margin-top: 18px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }

    .result[hidden] {
      display: none;
    }

    .result.success {
      border-color: rgba(15, 118, 110, 0.35);
      color: var(--success);
    }

    .result.error {
      border-color: rgba(180, 35, 24, 0.35);
      color: var(--danger);
    }

    code {
      word-break: break-all;
      color: var(--text);
    }
  </style>
</head>
<body>
  <main>
    <h1>LUPRO Notion DB 管理</h1>
    <p>Netlifyに保存済みの環境変数を使って、Notion親ページ配下のDBを作成または取得します。</p>

    <form id="create-form" autocomplete="off">
      <label for="token">
        保存トークン
        <input id="token" name="token" type="password" autocomplete="off" required>
      </label>
      <button id="submit" type="submit">Notion DBを作成</button>
    </form>

    <section id="result" class="result" hidden aria-live="polite"></section>

    <section class="note">
      <p>作成後に表示されるDatabase IDを、Netlify環境変数 <code>NOTION_DATABASE_ID</code> に追加してください。</p>
      <p>入力したトークンはブラウザに保存しません。送信時のAuthorizationヘッダーにだけ使用します。</p>
    </section>
  </main>

  <script>
    const form = document.querySelector("#create-form");
    const tokenInput = document.querySelector("#token");
    const submitButton = document.querySelector("#submit");
    const result = document.querySelector("#result");

    function showResult(type, html) {
      result.className = `result ${type}`;
      result.innerHTML = html;
      result.hidden = false;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const token = tokenInput.value.trim();
      if (!token) return;

      submitButton.disabled = true;
      submitButton.textContent = "作成中...";
      result.hidden = true;

      try {
        const response = await fetch("/.netlify/functions/create-notion-database", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${token}`
          }
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(data.error || "Notion DBの作成に失敗しました。");
        }

        tokenInput.value = "";
        showResult("success", `
          <strong>${data.created ? "作成しました。" : "既存DBを取得しました。"}</strong><br>
          Database ID: <code>${data.database_id}</code><br>
          <a href="${data.url}" target="_blank" rel="noreferrer">Notionで開く</a><br>
          Netlify環境変数 <code>NOTION_DATABASE_ID</code> にこのDatabase IDを追加してください。
        `);
      } catch (error) {
        showResult("error", `
          <strong>失敗しました。</strong><br>
          ${error.message}<br>
          Netlify環境変数、保存トークン、Notion親ページへの連携招待を確認してください。
        `);
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Notion DBを作成";
      }
    });
  </script>
</body>
</html>
