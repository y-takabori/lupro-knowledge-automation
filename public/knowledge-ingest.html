<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LUPRO Knowledge Ingest</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fa;
      --surface: #ffffff;
      --text: #17202a;
      --muted: #5f6f82;
      --line: #d8dee8;
      --accent: #176b5d;
      --accent-hover: #105246;
      --danger: #b42318;
      --success: #0f766e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.55;
    }

    main {
      width: min(100%, 960px);
      margin: 0 auto;
      padding: 24px 16px 44px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 25px;
      line-height: 1.25;
    }

    p {
      margin: 0;
      color: var(--muted);
    }

    form {
      display: grid;
      gap: 16px;
      margin-top: 22px;
      padding: 18px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .grid {
      display: grid;
      gap: 14px;
    }

    label {
      display: grid;
      gap: 7px;
      font-weight: 700;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 44px;
      padding: 10px 11px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      font: inherit;
    }

    textarea {
      min-height: 380px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 14px;
      line-height: 1.5;
    }

    button {
      min-height: 48px;
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.68;
    }

    button:not(:disabled):hover {
      background: var(--accent-hover);
    }

    .result {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      word-break: break-word;
    }

    .result[hidden] {
      display: none;
    }

    .result.success {
      border-color: rgba(15, 118, 110, 0.35);
      color: var(--success);
    }

    .result.error {
      border-color: rgba(180, 35, 24, 0.35);
      color: var(--danger);
    }

    a {
      color: var(--accent-hover);
      font-weight: 700;
    }

    @media (min-width: 720px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .full {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>LUPRO Knowledge Ingest</h1>
    <p>Slackモーダルに入りきらない長文JSON、相談ログ、Markdown、実装ログをGitHubのknowledge配下へ保存します。</p>

    <form id="knowledge-form">
      <div class="grid">
        <label>
          保存トークン
          <input id="token" type="password" autocomplete="off" required>
        </label>
        <label>
          title
          <input id="title" type="text" required>
        </label>
        <label>
          knowledge_type
          <select id="knowledge_type" required>
            <option value="tools">tools</option>
            <option value="content_strategy">content_strategy</option>
            <option value="projects">projects</option>
            <option value="marketing">marketing</option>
            <option value="sales">sales</option>
            <option value="operations">operations</option>
            <option value="client_work">client_work</option>
            <option value="internal_rules">internal_rules</option>
            <option value="learnings">learnings</option>
            <option value="other">other</option>
          </select>
        </label>
        <label>
          project_key
          <input id="project_key" type="text" pattern="[A-Za-z0-9-]+" placeholder="invoice-ai-assistant" required>
        </label>
        <label>
          category
          <input id="category" type="text">
        </label>
        <label>
          status
          <select id="status" required>
            <option value="draft">draft</option>
            <option value="saved">saved</option>
            <option value="active">active</option>
            <option value="article_candidate">article_candidate</option>
            <option value="published">published</option>
            <option value="archived">archived</option>
          </select>
        </label>
        <label>
          tools
          <input id="tools" type="text" placeholder="ChatGPT, Codex, Netlify">
        </label>
        <label>
          input_type
          <select id="input_type" required>
            <option value="markdown">markdown</option>
            <option value="json">json</option>
            <option value="plain_text">plain_text</option>
            <option value="url">url</option>
          </select>
        </label>
        <label>
          save_mode
          <select id="save_mode" required>
            <option value="upsert">upsert</option>
            <option value="new">new</option>
            <option value="update">update</option>
          </select>
        </label>
        <label class="full">
          summary
          <textarea id="summary" style="min-height: 120px"></textarea>
        </label>
        <label class="full">
          大量本文
          <textarea id="body" spellcheck="false" required></textarea>
        </label>
      </div>
      <button id="save" type="submit">GitHubへ保存</button>
      <section id="result" class="result" hidden aria-live="polite"></section>
    </form>
  </main>

  <script>
    const form = document.querySelector("#knowledge-form");
    const saveButton = document.querySelector("#save");
    const result = document.querySelector("#result");
    const fields = [
      "title",
      "knowledge_type",
      "project_key",
      "category",
      "status",
      "tools",
      "summary",
      "input_type",
      "save_mode",
      "body"
    ];

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function show(type, html) {
      result.className = `result ${type}`;
      result.innerHTML = html;
      result.hidden = false;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const token = document.querySelector("#token").value.trim();
      if (!token) return;

      const payload = Object.fromEntries(fields.map((id) => [id, document.querySelector(`#${id}`).value]));
      saveButton.disabled = true;
      show("", "保存中...");

      try {
        const response = await fetch("/.netlify/functions/save-knowledge-github", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          show("error", `<strong>保存に失敗しました。</strong><br>${escapeHtml(data.message || data.error || response.statusText)}`);
          return;
        }
        show("success", `
          <strong>保存しました。</strong><br>
          title: ${escapeHtml(data.title)}<br>
          knowledge_type: ${escapeHtml(data.knowledge_type)}<br>
          project_key: ${escapeHtml(data.project_key)}<br>
          index.md: <a href="${escapeHtml(data.index_url)}" target="_blank" rel="noreferrer">${escapeHtml(data.index_url)}</a><br>
          raw: <a href="${escapeHtml(data.raw_json_url || data.raw_txt_url)}" target="_blank" rel="noreferrer">${escapeHtml(data.raw_json_url || data.raw_txt_url)}</a>
        `);
      } catch (error) {
        show("error", `<strong>保存に失敗しました。</strong><br>${escapeHtml(error.message)}`);
      } finally {
        saveButton.disabled = false;
      }
    });
  </script>
</body>
</html>
